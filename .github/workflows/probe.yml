name: Probe sources
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request, re, sys
          sys.path.insert(0, "scripts")
          from kk.parse import html_to_text
          UA={"User-Agent":"Mozilla/5.0"}
          rss=urllib.request.urlopen(urllib.request.Request("https://www.theweek.in/kerala-lottery-results/lucky-draw.feeds.rss.xml",headers=UA),timeout=30).read().decode()
          items=re.findall(r"<item>(.*?)</item>",rss,re.S)
          print("ITEMS",len(items))
          links=[]
          for it in items:
              t=re.search(r"<title>(.*?)</title>",it,re.S); l=re.search(r"<link>(.*?)</link>",it,re.S); d=re.search(r"<pubDate>(.*?)</pubDate>",it)
              print("|", (t.group(1) if t else "")[:110], "|", l.group(1).strip() if l else "", "|", d.group(1) if d else "")
              if l: links.append(l.group(1).strip())
          h=urllib.request.urlopen(urllib.request.Request(links[0],headers=UA),timeout=30).read().decode("utf-8","replace")
          txt=html_to_text(h)
          i=txt.find("The result for")
          print("=====ARTICLE=====")
          print(re.sub(r"\n\s*\n+","\n",txt[i:i+7000]))
          PY
